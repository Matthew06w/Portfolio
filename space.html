<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="images/favicon.png">
<title>Matthew Hema — 3D Mode</title>
<meta name="description" content="Fly through Matthew Hema's projects in 3D, from 2024 to today.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script>
  // apply the saved theme before the page paints (shared with index.html)
  try { if (localStorage.getItem('theme') === 'light') document.documentElement.setAttribute('data-theme', 'light'); } catch (e) {}
  // reduced motion gets a normal, flat list of projects instead of the flight
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) document.documentElement.classList.add('flat');
</script>
<style>
  :root{
    --bg:#07090D;
    --surface:#121823;
    --border:#232C3B;
    --border-strong:#33405A;
    --text:#E8EDF5;
    --text-soft:#9AA6B8;
    --text-faint:#5E6B7E;
    --accent:#3FD0FF;
    --lime:#B6F36A;
    --pill-bg:rgba(7,9,13,.6);
    --card-bg:rgba(18,24,35,.82);
    --bg-2:#0D1118;
    --warm:#FFB547;
    --media-bg:#000;
    --media-bg-2:#05070A;
    --font-head:'Space Grotesk', system-ui, sans-serif;
    --font-mono:'JetBrains Mono', ui-monospace, monospace;
  }
  :root[data-theme="light"]{
    --bg:#F5F7FA;
    --surface:#FFFFFF;
    --border:#DDE3EB;
    --border-strong:#C4CEDA;
    --text:#0E141C;
    --text-soft:#4A5668;
    --text-faint:#7A8698;
    --accent:#0284C7;
    --lime:#4C9A0E;
    --pill-bg:rgba(255,255,255,.85);
    --card-bg:rgba(255,255,255,.9);
    --bg-2:#EDF1F6;
    --warm:#B86A00;
    --media-bg:#E9EEF4;
    --media-bg-2:#F1F4F8;
    color-scheme:light;
  }

  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:var(--font-head);
    line-height:1.5;
  }
  a{color:inherit;}
  ::selection{background:var(--lime); color:#0B1404;}

  /* ---- NAV + HUD ---- */
  .nav{
    position:fixed; top:0; left:0; right:0; z-index:20;
    display:flex; align-items:center; gap:10px;
    padding:18px 24px;
    pointer-events:none;
  }
  .nav > *{pointer-events:auto;}
  .pill{
    display:inline-flex; align-items:center; gap:8px;
    height:38px; padding:0 16px;
    border:1px solid var(--border); border-radius:999px;
    background:var(--pill-bg); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    color:var(--text); font:500 14px var(--font-head); text-decoration:none;
    cursor:pointer;
    transition:border-color .2s;
  }
  .pill:hover{border-color:var(--accent);}
  .mode{margin-right:auto; font-family:var(--font-mono); font-size:12px; letter-spacing:.08em; color:var(--accent);}
  .theme-toggle{width:38px; padding:0; justify-content:center;}
  .theme-toggle .sun{display:none;}
  [data-theme="light"] .theme-toggle .sun{display:block;}
  [data-theme="light"] .theme-toggle .moon{display:none;}
  #tiltBtn{display:none;}
  #tiltBtn.show{display:inline-flex;}

  .hud{
    position:fixed; left:24px; bottom:22px; z-index:20;
    font-family:var(--font-mono); font-size:12px; color:var(--text-faint);
    pointer-events:none;
  }
  .hud b{color:var(--accent); font-weight:500;}
  .progress{
    position:fixed; right:18px; top:50%; z-index:20;
    width:2px; height:160px; margin-top:-80px;
    background:var(--border); border-radius:2px; overflow:hidden;
  }
  .progress i{display:block; width:100%; height:100%; background:var(--accent); transform-origin:top; transform:scaleY(0);}

  /* ---- 3D STAGE ---- */
  #space{position:fixed; inset:0; width:100%; height:100%; display:block; z-index:0; pointer-events:none;}
  .stage{
    position:fixed; inset:0; z-index:1;
    perspective:800px; perspective-origin:50% 50%;
    overflow:hidden;
    pointer-events:none;
  }
  .world{
    position:absolute; left:50%; top:50%; width:0; height:0;
    transform-style:preserve-3d;
  }
  .item{
    position:absolute; left:0; top:0;
    opacity:0;
    will-change:opacity;
  }
  .item.live{pointer-events:auto;}

  .intro{width:min(720px, 88vw); text-align:center;}
  .kicker{font-family:var(--font-mono); font-size:12px; letter-spacing:.12em; color:var(--accent);}
  .intro h1{font-size:clamp(46px, 9vw, 96px); line-height:.95; margin:14px 0 18px; letter-spacing:-0.03em;}
  .intro h1 span{
    background:linear-gradient(90deg, var(--accent), var(--lime));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .intro p{color:var(--text-soft); font-size:18px; margin:0 auto; max-width:46ch;}
  .hint{margin-top:30px; font-family:var(--font-mono); font-size:12px; color:var(--text-faint); animation:bob 2s ease-in-out infinite;}
  @keyframes bob{50%{transform:translateY(6px);}}

  .year{text-align:center; white-space:nowrap;}
  .year .n{
    font-size:clamp(90px, 14vw, 160px); font-weight:700; line-height:1; letter-spacing:-0.04em;
    color:transparent; -webkit-text-stroke:2px var(--accent);
  }

  .card{
    display:block; width:min(360px, 78vw);
    border:1px solid var(--border-strong); border-radius:18px; overflow:hidden;
    background:var(--card-bg); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
    text-decoration:none;
    box-shadow:0 30px 80px -30px rgba(0,0,0,.6);
    transition:border-color .25s, box-shadow .25s;
  }
  .card:hover, .card.hover, .card:focus-visible{
    border-color:var(--accent); outline:none;
    box-shadow:0 0 0 1px var(--accent), 0 30px 90px -20px rgba(63,208,255,.35);
  }
  .card-media img{transition:transform .6s ease;}
  .card:hover .card-media img, .card.hover .card-media img{transform:scale(1.06);}
  .btn.hover{border-color:var(--accent);}
  body.pointing{cursor:pointer;}
  .card-media{position:relative; aspect-ratio:16/10; background:var(--surface); overflow:hidden;}
  .card-media img{width:100%; height:100%; object-fit:cover; display:block;}
  .card-media .no-img{
    position:absolute; inset:0; display:grid; place-items:center;
    font-family:var(--font-mono); font-size:12px; color:var(--text-faint);
  }
  .badge{
    position:absolute; top:12px; left:12px;
    padding:4px 10px; border-radius:999px;
    background:var(--lime); color:#0B1404;
    font-family:var(--font-mono); font-size:11px; font-weight:700;
  }
  .card-body{padding:18px 20px 20px;}
  .meta{font-family:var(--font-mono); font-size:11px; letter-spacing:.06em; color:var(--text-faint);}
  .card h2{font-size:24px; line-height:1.15; margin:6px 0 4px; letter-spacing:-0.01em;}
  .card .sub{color:var(--text-soft); font-size:14.5px; margin:0;}
  .tags{display:flex; flex-wrap:wrap; gap:6px; margin-top:14px;}
  .tag{
    padding:3px 10px; border:1px solid var(--border-strong); border-radius:999px;
    font-family:var(--font-mono); font-size:11px; color:var(--accent);
  }
  .go{margin-top:14px; font-family:var(--font-mono); font-size:12px; color:var(--text-faint);}
  .card:hover .go, .card.hover .go, .card:focus-visible .go{color:var(--accent);}

  .card.next{border-style:dashed; text-align:center; padding:46px 20px;}
  .card.next .plus{font-size:44px; line-height:1; color:var(--accent);}

  .outro{width:min(640px, 88vw); text-align:center;}
  .outro h2{font-size:clamp(40px, 7vw, 72px); line-height:1; margin:14px 0 18px; letter-spacing:-0.03em;}
  .outro p{color:var(--text-soft); margin:0 0 26px;}
  .btns{display:flex; flex-wrap:wrap; gap:10px; justify-content:center;}
  .btn{
    display:inline-flex; align-items:center; height:46px; padding:0 20px;
    border:1px solid var(--border-strong); border-radius:999px;
    background:var(--pill-bg); text-decoration:none; font-weight:500;
    transition:border-color .2s, background .2s;
  }
  .btn:hover{border-color:var(--accent);}
  .btn.primary{background:var(--accent); border-color:var(--accent); color:#04121A;}

  .spacer{position:relative; z-index:-1;}

  /* ---- PROJECT POPUP (same look as the one on index.html) ---- */
  .modal{position:fixed; inset:0; z-index:100; display:none; align-items:center; justify-content:center; padding:24px;}
  .modal.open{display:flex;}
  .modal-backdrop{position:absolute; inset:0; background:rgba(3,5,8,.72); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); animation:fade .25s ease;}
  .modal-panel{
    position:relative; width:min(1040px, 100%); max-height:calc(100vh - 48px); overflow:auto;
    background:var(--bg-2); border:1px solid var(--border-strong); border-radius:22px;
    box-shadow:0 40px 120px rgba(0,0,0,.6);
    animation:pop .35s cubic-bezier(.2,.9,.3,1.2);
  }
  @keyframes fade{from{opacity:0;}}
  @keyframes pop{from{opacity:0; transform:perspective(900px) translateZ(-160px) rotateX(6deg);}}
  .modal-close{
    position:absolute; top:14px; right:14px; z-index:3;
    width:40px; height:40px; border-radius:50%;
    border:1px solid var(--border-strong); background:rgba(7,9,13,.8);
    color:var(--text); font-size:20px; cursor:pointer; display:grid; place-items:center;
  }
  .modal-close:hover{border-color:var(--accent); color:var(--accent);}
  [data-theme="light"] .modal-close{background:rgba(255,255,255,.88);}
  [data-theme="light"] .modal-panel{box-shadow:0 40px 100px rgba(15,30,50,.25);}
  .modal-grid{display:grid; grid-template-columns:1.15fr 1fr;}
  .modal-gallery{padding:16px; background:var(--media-bg); border-radius:22px 0 0 22px;}
  .modal-main{aspect-ratio:4/3; border-radius:12px; overflow:hidden; background:var(--media-bg-2);}
  .modal-main:has(iframe){aspect-ratio:16/9;}
  .modal-main img{width:100%; height:100%; object-fit:contain; display:block;}
  .modal-main iframe{width:100%; height:100%; border:0; display:block;}
  .modal-main .none{display:grid; place-items:center; height:100%; font-family:var(--font-mono); font-size:12px; color:var(--text-faint);}
  .modal-thumbs{display:flex; gap:8px; margin-top:10px; flex-wrap:wrap;}
  .thumb{
    position:relative; width:84px; aspect-ratio:4/3; padding:0;
    border-radius:8px; overflow:hidden; border:2px solid transparent;
    background:var(--media-bg-2); cursor:pointer; opacity:.55;
    transition:opacity .2s, border-color .2s;
  }
  .thumb img{width:100%; height:100%; object-fit:cover; display:block;}
  .thumb.is-video::after{content:"\25B6"; position:absolute; inset:0; display:grid; place-items:center; color:#fff; font-size:16px; background:rgba(0,0,0,.35);}
  .thumb-text{display:grid; place-items:center; height:100%; font-family:var(--font-mono); font-size:11px; color:var(--text-soft);}
  .thumb.active, .thumb:hover{opacity:1; border-color:var(--accent);}
  .thumb-label{font-family:var(--font-mono); font-size:11px; color:var(--text-faint); margin-top:8px;}
  .modal-info{padding:36px 34px 34px;}
  .m-type{font-family:var(--font-mono); font-size:12px; color:var(--warm);}
  .modal-info h3{font-size:clamp(26px, 3.4vw, 34px); line-height:1.1; letter-spacing:-0.02em; margin:10px 0 6px;}
  .m-sub{color:var(--accent); margin:0 0 18px; font-weight:500;}
  .modal-info p{color:var(--text-soft); margin:0 0 14px;}
  .results{display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; margin:18px 0 0;}
  .result{border:1px solid var(--border); background:var(--surface); border-radius:12px; padding:12px;}
  .r-num{font-size:22px; font-weight:700; color:var(--accent); line-height:1.1;}
  .r-lbl{font-family:var(--font-mono); font-size:10.5px; color:var(--text-faint); margin-top:4px; line-height:1.4;}
  .awards{list-style:none; padding:0; margin:18px 0 0; display:grid; gap:8px;}
  .awards li{
    display:flex; gap:10px; align-items:flex-start; font-size:14px;
    border:1px solid rgba(255,181,71,.25); background:rgba(255,181,71,.05);
    border-radius:10px; padding:9px 12px;
  }
  .awards li::before{content:"\2605"; color:var(--warm); flex:none;}
  .modal .tags{margin-top:18px;}
  .specs{margin:22px 0 0; border:1px solid var(--border); border-radius:14px; overflow:hidden;}
  .spec{display:grid; grid-template-columns:120px 1fr; gap:14px; padding:11px 16px; font-size:14px; border-top:1px solid var(--border);}
  .spec:first-child{border-top:none;}
  .spec dt{font-family:var(--font-mono); font-size:11.5px; color:var(--text-faint); padding-top:2px; letter-spacing:.03em;}
  .spec dd{margin:0;}
  .m-link{
    display:inline-flex; align-items:center; gap:8px; margin-top:22px;
    color:var(--accent); font-weight:600; text-decoration:none;
    border-bottom:1px solid rgba(63,208,255,.4);
  }
  body.modal-on{overflow:hidden;}
  @media (max-width:960px){
    .modal-grid{grid-template-columns:1fr;}
    .modal-gallery{border-radius:22px 22px 0 0;}
  }
  @media (max-width:640px){
    .modal{padding:0;}
    .modal-panel{max-height:100vh; height:100%; border-radius:0;}
    .modal-gallery{border-radius:0;}
    .modal-info{padding:26px 20px;}
    .spec{grid-template-columns:96px 1fr;}
  }

  /* ---- FLAT MODE (reduced motion): a plain list, no flight ---- */
  .flat #space, .flat .spacer, .flat .progress, .flat .hud, .flat .hint{display:none;}
  .flat .stage{position:static; perspective:none; overflow:visible; pointer-events:auto;}
  .flat .world{
    position:static; width:auto; height:auto; transform:none !important;
    display:flex; flex-direction:column; align-items:center; gap:40px;
    padding:110px 24px 80px;
  }
  .flat .item{position:static; transform:none !important; opacity:1 !important; pointer-events:auto;}
  .flat .year .n{font-size:72px;}

  @media (max-width:640px){
    .nav{padding:14px 16px;}
    .hud{left:16px; bottom:16px;}
    .progress{right:10px;}
    .mode{display:none;}
    .nav .back{margin-right:auto;}
  }
</style>
</head>
<body>

<nav class="nav">
  <a class="pill back" href="index.html">← Portfolio</a>
  <span class="mode">// 3D MODE</span>
  <button class="pill" id="tiltBtn" type="button">Enable tilt</button>
  <button class="pill theme-toggle" id="themeToggle" type="button" aria-label="Switch light / dark mode">
    <svg class="moon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    <svg class="sun" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 1.5v2.5M12 20v2.5M4.6 4.6l1.8 1.8M17.6 17.6l1.8 1.8M1.5 12H4M20 12h2.5M4.6 19.4l1.8-1.8M17.6 6.4l1.8-1.8"/></svg>
  </button>
</nav>

<canvas id="space" aria-hidden="true"></canvas>
<main class="stage" id="stage">
  <div class="world" id="world"></div>
</main>
<div class="spacer" id="spacer" aria-hidden="true"></div>

<div class="hud" aria-hidden="true">YEAR <b id="hudYear">—</b> · DEPTH <b id="hudDepth">0</b> m</div>
<div class="progress" aria-hidden="true"><i id="progress"></i></div>

<div class="modal" id="modal" aria-hidden="true">
  <div class="modal-backdrop" data-close></div>
  <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <button class="modal-close" type="button" data-close aria-label="Close">&times;</button>
    <div class="modal-grid">
      <div class="modal-gallery">
        <div class="modal-main" id="mMain"></div>
        <div class="modal-thumbs" id="mThumbs"></div>
        <div class="thumb-label" id="mImgLabel"></div>
      </div>
      <div class="modal-info" id="mInfo"></div>
    </div>
  </div>
</div>

<script src="projects.js"></script>
<script>
(function(){
  "use strict";

  /* ---- TWEAK THESE ---- */
  var PERSPECTIVE  = 800;   // must match .stage perspective in the CSS
  var SPACING      = 700;   // depth between project cards, in px
  var YEAR_GAP     = 650;   // depth between a year label and its first card
  var SCROLL_SPEED = 1;     // px of depth flown per px scrolled
  var EASE         = 0.09;  // how smoothly the camera catches up (lower = floatier)
  var PARALLAX_X   = 70;    // how far the view shifts with the mouse or tilt, in px
  var PARALLAX_Y   = 45;
  var FLOOR_Y      = 380;   // height of the grid floor below the centre line
  var GRID         = 160;   // grid square size
  var FAR          = 4200;  // how far ahead the grid and stars reach
  var ITEM_FAR     = 2600;  // how far ahead cards start to fade in
  var YEAR_LIFT    = -290;  // year labels float this far above the cards
  var STARS        = 260;

  var root = document.documentElement;
  var flat = root.classList.contains('flat');
  var world = document.getElementById('world');

  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  var MONTHS = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
  function niceDate(d){ var m = +d.slice(5, 7); return (m ? MONTHS[m - 1] + ' ' : '') + d.slice(0, 4); }
  function cover(p){
    var img = p.images.filter(function(m){ return m.src; })[0];
    var vid = p.images.filter(function(m){ return m.youtube; })[0];
    return img ? img.src : vid ? 'https://i.ytimg.com/vi/' + vid.youtube + '/hqdefault.jpg' : null;
  }

  /* ---- Build the scene: intro, then projects oldest → newest, then contact ---- */
  var projects = PROJECTS.filter(function(p){ return !p.placeholder; })
    .sort(function(a, b){ return a.date.localeCompare(b.date); });

  var items = [];   // { el, x, y, z, ry, year }
  function add(html, cls, opts){
    var el = document.createElement(opts.tag || 'div');
    el.className = 'item ' + cls;
    el.innerHTML = html;
    if (opts.href){ el.href = opts.href; }
    if (opts.id){ el.setAttribute('data-id', opts.id); }
    world.appendChild(el);
    var it = { el:el, z:opts.z, side:opts.side || 0, jitter:(opts.jitter || 0) + (opts.lift || 0), year:opts.year || null };
    items.push(it);
    return it;
  }

  var z = 0;
  add('<div class="kicker">// 3D MODE · ' + projects.length + ' PROJECTS</div>' +
      '<h1>Matthew <span>Hema</span></h1>' +
      '<p>Fly through what I\'ve built, from 2024 to today. Click any project to open its full breakdown.</p>' +
      '<div class="hint">SCROLL TO FLY ↓</div>', 'intro', { z:z });
  z -= 1500;

  var lastYear = null;
  projects.forEach(function(p, i){
    var year = p.date.slice(0, 4);
    if (year !== lastYear){
      add('<div class="kicker">// YEAR</div><div class="n">' + year + '</div>', 'year', { z:z, year:year, lift:YEAR_LIFT });
      z -= YEAR_GAP;
      lastYear = year;
    }
    var src = cover(p);
    add(
      '<div class="card-media">' +
        (src ? '<img src="' + src + '" alt="" loading="lazy">' : '<div class="no-img">SLIDES INSIDE</div>') +
        (p.badge ? '<span class="badge">★ ' + esc(p.badge) + '</span>' : '') +
      '</div>' +
      '<div class="card-body">' +
        '<div class="meta">' + esc(niceDate(p.date)) + ' · ' + esc(p.type.split(' · ')[0]) + '</div>' +
        '<h2>' + esc(p.title) + '</h2>' +
        '<p class="sub">' + esc(p.subtitle) + '</p>' +
        '<div class="tags">' + p.tags.map(function(t){ return '<span class="tag">' + esc(t) + '</span>'; }).join('') + '</div>' +
        '<div class="go">OPEN PROJECT →</div>' +
      '</div>',
      'card', { tag:'a', href:'index.html#open-' + p.id, id:p.id, z:z, side:i % 2 ? 1 : -1, jitter:(i * 37 % 5 - 2) * 22, year:year });
    z -= SPACING;
  });

  add('<div class="plus">+</div><h2>Next project</h2><p class="sub">in the works…</p>', 'card next', { z:z });
  z -= 1000;
  var end = add('<div class="kicker">// END OF THE LINE · FOR NOW</div>' +
      '<h2>Let\'s build<br>something.</h2>' +
      '<p>Open to internships, research and collaborations in computer vision, hardware and product design.</p>' +
      '<div class="btns">' +
        '<a class="btn primary" href="mailto:1010274@mymail.sutd.edu.sg">Email me</a>' +
        '<a class="btn" href="https://www.linkedin.com/in/matthew-hema/" target="_blank" rel="noopener noreferrer">LinkedIn</a>' +
        '<a class="btn" href="index.html">Back to portfolio</a>' +
      '</div>', 'outro', { z:z });
  var DEPTH = -end.z;

  /* ---- Theme toggle (same saved setting as the other pages) ---- */
  var colors = {};
  function readColors(){
    var cs = getComputedStyle(root);
    colors.accent = cs.getPropertyValue('--accent').trim();
    colors.text = cs.getPropertyValue('--text').trim();
    colors.light = root.getAttribute('data-theme') === 'light';
  }
  readColors();
  document.getElementById('themeToggle').addEventListener('click', function(){
    var light = root.getAttribute('data-theme') !== 'light';
    if (light) root.setAttribute('data-theme', 'light'); else root.removeAttribute('data-theme');
    try { localStorage.setItem('theme', light ? 'light' : 'dark'); } catch (e) {}
    readColors();
    if (!flat) wake(true);
  });

  /* ---- Project popup: opens right here, so you stay in 3D mode ---- */
  var modal = document.getElementById('modal');
  var mMain = document.getElementById('mMain');
  var mThumbs = document.getElementById('mThumbs');
  var mImgLabel = document.getElementById('mImgLabel');
  var lastFocus = null;
  var ARROW = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
  var FRAME = 'allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share; fullscreen" ' +
    'referrerpolicy="strict-origin-when-cross-origin" allowfullscreen';

  function showMedia(p, i){
    var m = p.images[i];
    if (!m){ mMain.innerHTML = '<div class="none">Photos coming soon</div>'; mImgLabel.textContent = ''; return; }
    var title = esc(p.title + ' — ' + m.label);
    mMain.innerHTML = m.youtube
      ? '<iframe src="https://www.youtube-nocookie.com/embed/' + esc(m.youtube) + '?rel=0" title="' + title + '" ' + FRAME + '></iframe>'
      : m.embed
        ? '<iframe src="' + esc(m.embed) + '" title="' + title + '" ' + FRAME + ' loading="lazy"></iframe>'
        : '<img src="' + m.src + '" alt="' + title + '">';
    mImgLabel.textContent = p.images.length > 1 ? (i + 1) + ' / ' + p.images.length + ' — ' + m.label : m.label;
    mThumbs.querySelectorAll('.thumb').forEach(function(t, j){ t.classList.toggle('active', j === i); });
  }

  function openModal(id){
    var p = PROJECTS.filter(function(x){ return x.id === id; })[0];
    if (!p) return;
    lastFocus = document.activeElement;
    document.getElementById('mInfo').innerHTML =
      '<div class="m-type">' + esc(p.type) + '</div>' +
      '<h3 id="mTitle">' + esc(p.title) + '</h3>' +
      '<div class="m-sub">' + esc(p.subtitle) + '</div>' +
      p.desc.map(function(d){ return '<p>' + esc(d) + '</p>'; }).join('') +
      (p.results ? '<div class="results">' + p.results.map(function(r){
        return '<div class="result"><div class="r-num">' + esc(r[0]) + '</div><div class="r-lbl">' + esc(r[1]) + '</div></div>';
      }).join('') + '</div>' : '') +
      (p.awards ? '<ul class="awards">' + p.awards.map(function(a){ return '<li>' + esc(a) + '</li>'; }).join('') + '</ul>' : '') +
      '<div class="tags">' + p.tags.map(function(t){ return '<span class="tag">' + esc(t) + '</span>'; }).join('') + '</div>' +
      '<dl class="specs">' + p.specs.map(function(s){
        return '<div class="spec"><dt>' + esc(s[0].toUpperCase()) + '</dt><dd>' + esc(s[1]) + '</dd></div>';
      }).join('') + '</dl>' +
      (p.link ? '<a class="m-link" href="' + esc(p.link.href) + '" target="_blank" rel="noopener noreferrer">' + esc(p.link.text) + ' ' + ARROW + '</a>' : '');
    mThumbs.innerHTML = p.images.length > 1 ? p.images.map(function(m, i){
      var inner = m.embed ? '<span class="thumb-text">SLIDES</span>'
        : '<img src="' + (m.youtube ? 'https://i.ytimg.com/vi/' + m.youtube + '/hqdefault.jpg' : m.src) + '" alt="">';
      return '<button class="thumb' + (m.youtube ? ' is-video' : '') + '" type="button" data-i="' + i + '" aria-label="' + esc(m.label) + '">' + inner + '</button>';
    }).join('') : '';
    mThumbs.onclick = function(e){
      var t = e.target.closest('.thumb');
      if (t) showMedia(p, +t.getAttribute('data-i'));
    };
    showMedia(p, 0);
    modal.classList.add('open');
    modal.setAttribute('aria-hidden', 'false');
    document.body.classList.add('modal-on');
    modal.querySelector('.modal-close').focus({ preventScroll:true });
  }
  function closeModal(){
    modal.classList.remove('open');
    modal.setAttribute('aria-hidden', 'true');
    mMain.innerHTML = '';   // stops any playing video
    document.body.classList.remove('modal-on');
    if (lastFocus) lastFocus.focus({ preventScroll:true });
  }
  function modalOpen(){ return modal.classList.contains('open'); }

  // a card click (real, keyboard, or found by the 3D hit test below) opens its popup
  document.addEventListener('click', function(e){
    if (e.target.closest('[data-close]')){ closeModal(); return; }
    var card = e.target.closest('a.card[data-id]');
    if (card && !modalOpen()){ e.preventDefault(); openModal(card.getAttribute('data-id')); }
  });
  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape' && modalOpen()) closeModal();
  });

  if (flat) return;   // reduced motion: the CSS shows a plain list and we're done

  /* ---- Layout: place every item in 3D (re-run when the window resizes) ---- */
  var vw, vh;
  function layout(){
    vw = window.innerWidth; vh = window.innerHeight;
    var spread = vw < 700 ? vw * 0.06 : Math.min(vw * 0.22, 300);
    items.forEach(function(it){
      it.x = it.side * spread;
      it.y = it.jitter;
      var ry = vw < 700 ? 0 : -it.side * 14;
      it.el.style.transform = 'translate3d(' + it.x + 'px,' + it.y + 'px,' + it.z + 'px) rotateY(' + ry + 'deg) translate(-50%,-50%)';
    });
    document.getElementById('spacer').style.height = (DEPTH / SCROLL_SPEED + vh) + 'px';
    resizeCanvas();
    wake(true);
  }

  /* ---- Background: star field and grid floor, projected with the same camera as the cards ---- */
  var canvas = document.getElementById('space');
  var ctx = canvas.getContext('2d');
  var dpr = 1;
  function resizeCanvas(){
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = vw * dpr; canvas.height = vh * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  var stars = [];
  for (var s = 0; s < STARS; s++){
    stars.push({ x:(Math.random() - 0.5) * 4200, y:(Math.random() - 0.5) * 2400 - 200, z:PERSPECTIVE - Math.random() * (DEPTH + FAR + PERSPECTIVE) });
  }

  var camZ = 0, camX = 0, camY = 0, aimX = 0, aimY = 0;
  function project(x, y, zz){
    var rel = zz + camZ;
    var k = PERSPECTIVE / (PERSPECTIVE - rel);
    return { x:vw / 2 + (x - camX) * k, y:vh / 2 + (y - camY) * k, k:k, rel:rel };
  }
  function rgba(hex, a){
    var h = hex.replace('#', '');
    if (h.length === 3) h = h.replace(/./g, '$&$&');
    var n = parseInt(h, 16);
    return 'rgba(' + (n >> 16 & 255) + ',' + (n >> 8 & 255) + ',' + (n & 255) + ',' + a.toFixed(3) + ')';
  }

  function drawBackground(){
    ctx.clearRect(0, 0, vw, vh);
    var near = PERSPECTIVE * 0.85;
    var lineA = colors.light ? 0.35 : 0.28;

    // grid floor: lines running into the distance
    for (var gx = -24; gx <= 24; gx++){
      var a = project(gx * GRID, FLOOR_Y, near - camZ);
      var b = project(gx * GRID, FLOOR_Y, -FAR - camZ);
      var g = ctx.createLinearGradient(a.x, a.y, b.x, b.y);
      g.addColorStop(0, rgba(colors.accent, lineA));
      g.addColorStop(1, rgba(colors.accent, 0));
      ctx.strokeStyle = g;
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
    }
    // grid floor: lines across, sliding toward you as you fly
    var first = Math.ceil((camZ - near) / GRID), last = Math.floor((camZ + FAR) / GRID);
    for (var gz = first; gz <= last; gz++){
      var zz = -gz * GRID;
      var l = project(-24 * GRID, FLOOR_Y, zz), r = project(24 * GRID, FLOOR_Y, zz);
      var fade = 1 - Math.min(1, -l.rel / FAR);
      if (fade <= 0) continue;
      ctx.strokeStyle = rgba(colors.accent, lineA * fade);
      ctx.beginPath(); ctx.moveTo(l.x, l.y); ctx.lineTo(r.x, r.y); ctx.stroke();
    }

    // stars
    for (var i = 0; i < stars.length; i++){
      var st = stars[i];
      var p = project(st.x, st.y, st.z);
      if (p.rel > near || p.rel < -FAR * 1.4) continue;
      if (p.x < -10 || p.x > vw + 10 || p.y < -10 || p.y > vh + 10) continue;
      var alpha = Math.min(1, 1 + p.rel / (FAR * 1.4)) * (colors.light ? 0.45 : 0.8);
      var size = Math.max(0.6, 1.8 * p.k);
      ctx.fillStyle = rgba(i % 7 ? colors.text : colors.accent, alpha);
      ctx.fillRect(p.x - size / 2, p.y - size / 2, size, size);
    }
  }

  /* ---- Fade items in from the distance, and out just before they reach you ---- */
  function itemOpacity(rel){
    var nearStart = PERSPECTIVE * 0.05, nearEnd = PERSPECTIVE * 0.4;
    if (rel > nearEnd || rel < -ITEM_FAR) return 0;
    if (rel > nearStart) return 1 - (rel - nearStart) / (nearEnd - nearStart);
    if (rel < -ITEM_FAR * 0.5) return (rel + ITEM_FAR) / (ITEM_FAR * 0.5);
    return 1;
  }

  var hudYear = document.getElementById('hudYear');
  var hudDepth = document.getElementById('hudDepth');
  var bar = document.getElementById('progress');

  /* ---- Render loop: runs while something is moving, then sleeps ---- */
  var frame = 0, lastTime = 0, force = true;
  function tick(now){
    var frames = lastTime ? Math.min((now - lastTime) / (1000 / 60), 6) : 1;
    lastTime = now;
    var target = Math.min(DEPTH, window.scrollY * SCROLL_SPEED);
    var k = 1 - Math.pow(1 - EASE, frames);
    camZ += (target - camZ) * k;
    camX += (aimX * PARALLAX_X - camX) * k;
    camY += (aimY * PARALLAX_Y - camY) * k;
    var settled = Math.abs(target - camZ) < 0.3 && Math.abs(aimX * PARALLAX_X - camX) < 0.1 && Math.abs(aimY * PARALLAX_Y - camY) < 0.1;
    if (settled){ camZ = target; }

    world.style.transform = 'translate3d(' + (-camX).toFixed(2) + 'px,' + (-camY).toFixed(2) + 'px,' + camZ.toFixed(2) + 'px)';
    var year = null;
    var reveal = Math.min(1, camZ / 350);   // keep the opening screen clean until you start flying
    items.forEach(function(it, i){
      var rel = it.z + camZ;
      var o = itemOpacity(rel) * (i === 0 ? 1 : reveal);
      it.el.style.opacity = o.toFixed(3);
      it.el.classList.toggle('live', o > 0.6);
      if (it.year && rel > -SPACING * 0.8) year = it.year;   // the latest year you've reached
    });
    drawBackground();
    hudYear.textContent = year || '—';
    hudDepth.textContent = Math.round(camZ / 10);
    bar.style.transform = 'scaleY(' + (camZ / DEPTH).toFixed(4) + ')';

    if (settled && !force){ frame = 0; lastTime = 0; return; }
    force = false;
    frame = requestAnimationFrame(tick);
  }
  function wake(redraw){
    if (redraw) force = true;
    if (!frame && !document.hidden) frame = requestAnimationFrame(tick);
  }

  window.addEventListener('scroll', function(){ wake(); }, { passive:true });
  window.addEventListener('resize', layout);
  document.addEventListener('visibilitychange', function(){ if (!document.hidden) wake(true); });

  // mouse moves the view a little, like leaning to look around
  window.addEventListener('pointermove', function(e){
    if (e.pointerType !== 'mouse') return;
    aimX = (e.clientX / vw - 0.5) * 2;
    aimY = (e.clientY / vh - 0.5) * 2;
    wake();
  }, { passive:true });

  // phones: tilting does the same (iPhones need a tap to allow it)
  // the first reading is "straight ahead", so it works however the phone is held
  var tiltBase = null;
  function onTilt(e){
    if (e.gamma == null || e.beta == null) return;
    if (!tiltBase) tiltBase = { g:e.gamma, b:e.beta };
    aimX = Math.max(-1, Math.min(1, (e.gamma - tiltBase.g) / 25));
    aimY = Math.max(-1, Math.min(1, (e.beta - tiltBase.b) / 25));
    wake();
  }
  var tiltBtn = document.getElementById('tiltBtn');
  var touch = window.matchMedia('(pointer: coarse)').matches;
  if (touch && window.DeviceOrientationEvent && typeof DeviceOrientationEvent.requestPermission === 'function'){
    tiltBtn.classList.add('show');
    tiltBtn.addEventListener('click', function(){
      DeviceOrientationEvent.requestPermission().then(function(state){
        if (state === 'granted'){ window.addEventListener('deviceorientation', onTilt); tiltBtn.classList.remove('show'); }
      }).catch(function(){});
    });
  } else {
    window.addEventListener('deviceorientation', onTilt);
  }

  /* ---- Clicks and hover ----
     Browsers don't reliably hit-test elements inside a moving 3D scene, so we find the link
     under the pointer ourselves: the nearest visible item whose on-screen box contains it. */
  function linkAt(x, y){
    var best = null, bestRel = -Infinity;
    items.forEach(function(it){
      if (!it.el.classList.contains('live')) return;
      var rel = it.z + camZ;
      if (rel <= bestRel) return;
      var links = it.el.tagName === 'A' ? [it.el] : [].slice.call(it.el.querySelectorAll('a'));
      links.forEach(function(a){
        var r = a.getBoundingClientRect();
        if (x >= r.left && x <= r.right && y >= r.top && y <= r.bottom){ best = a; bestRel = rel; }
      });
    });
    return best;
  }
  var hovered = null;
  function setHover(a){
    if (a === hovered) return;
    if (hovered) hovered.classList.remove('hover');
    hovered = a;
    if (a) a.classList.add('hover');
    document.body.classList.toggle('pointing', !!a);
  }
  window.addEventListener('pointermove', function(e){
    if (e.pointerType === 'mouse') setHover(e.target.closest('.nav') || modalOpen() ? null : linkAt(e.clientX, e.clientY));
  }, { passive:true });
  window.addEventListener('scroll', function(){ setHover(null); }, { passive:true });
  document.addEventListener('click', function(e){
    if (modalOpen() || e.target.closest('.nav, .modal, .item a, a.item')) return;   // a real link was hit: the browser handles it
    var a = linkAt(e.clientX, e.clientY);
    if (a){ e.preventDefault(); a.click(); }
  });

  // keyboard: tabbing to a card flies the camera to it
  items.forEach(function(it){
    it.el.addEventListener('focusin', function(){
      if (!modalOpen()) window.scrollTo(0, Math.max(0, (-it.z - 150) / SCROLL_SPEED));
    });
  });

  layout();
})();
</script>
</body>
</html>
